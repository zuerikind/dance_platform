# Skip gateway JWT verification so the function receives the request and can validate
# the user token itself (adminClient.auth.getUser(token)). Avoids 401 from gateway
# when using newer JWT signing keys or when the gateway rejects valid tokens.
[functions.calendly-oauth-start]
verify_jwt = false

# Callback is invoked by Calendly's redirect (browser GET); no Authorization header
# is sent. The function validates the OAuth state from the DB and exchanges the code.
[functions.calendly-oauth-callback]
verify_jwt = false

# These validate the user JWT inside the function (getUser(token)).
[functions.calendly-disconnect]
verify_jwt = false
[functions.calendly-list-event-types]
verify_jwt = false

# notifications_send validates the user JWT itself via serviceClient.auth.getUser(token).
# verify_jwt = false prevents the gateway from rejecting valid tokens before the function runs.
[functions.notifications_send]
verify_jwt = false

[functions.send_clase_suelta_confirmation]
verify_jwt = false

[functions.notify_clase_suelta_request]
verify_jwt = false

[functions.notify_class_cancellation]
verify_jwt = false

[functions.send_private_lesson_confirmation]
verify_jwt = false

# admin-auth-sync verifies legacy credentials internally; no JWT needed from the gateway.
[functions.admin-auth-sync]
verify_jwt = false

# stripe-create-checkout validates the user JWT itself via serviceClient.auth.getUser(token).
# verify_jwt = false prevents the gateway from rejecting valid tokens before the function runs.
[functions.stripe-create-checkout]
verify_jwt = false

# stripe-webhook is called by Stripe (no Supabase JWT). Auth is via STRIPE_WEBHOOK_SECRET
# signature verification inside the function.
[functions.stripe-webhook]
verify_jwt = false
